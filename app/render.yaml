services:
  - type: web
    name: ritm-ads
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DEMO_MODE
        value: "false"
      - key: APP_ORIGIN
        value: https://ritm-ads.onrender.com
      - key: AI_PROVIDER
        value: remote-ollama
      - key: OLLAMA_MODEL
        value: qwen3.5:4b
      - key: REMOTE_AI_WORKER_TOKEN
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: YANDEX_CLIENT_ID
        sync: false
      - key: YANDEX_CLIENT_SECRET
        sync: false
      - key: TOKEN_ENCRYPTION_KEY
        sync: false
      - key: LIVE_ADS_ENABLED
        value: "true"
      - key: AUTOPILOT_ENABLED
        value: "false"
      - key: AUTOPILOT_WORKER_TOKEN
        generateValue: true
      - key: DIRECT_WRITE_PILOT_ENABLED
        value: "true"
      - key: DIRECT_MODERATION_PILOT_ENABLED
        value: "false"
      - key: DIRECT_RESUME_PILOT_ENABLED
        value: "false"
      - key: DIRECT_IMAGE_UPLOAD_PILOT_ENABLED
        value: "true"
      - key: DIRECT_ARCHIVE_PILOT_ENABLED
        value: "false"
      - key: DIRECT_AB_VARIANT_PILOT_ENABLED
        value: "false"
      - key: DIRECT_AB_DECISION_PILOT_ENABLED
        value: "false"
      - key: CREATIVE_IMAGES_ENABLED
        value: "false"
      - key: POSTGRES_SSL
        value: "true"
      - key: REQUIRE_POSTGRES
        value: "true"
      - key: POSTGRES_ASYNC_PILOT
        value: "true"
